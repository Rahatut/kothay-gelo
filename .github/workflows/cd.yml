name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DATABASE_URL: postgresql://kothay_app.jgtbzferwrtxhqizmwtg:kothaygeloTAKA123@aws-0-ap-south-1.pooler.supabase.com:5432/postgres
  APP_URL: https://kothay-gelo.example.com
  PORT: 3000
  DISABLE_HMR: "true"
  GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ci]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Run migrations
        run: node --import tsx -e "
            import 'dotenv/config';
            import { migrate } from './server/db/migrate.js';
            const result = await migrate();
            console.log('Applied:', result.applied.length, 'migrations');
          "
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Deploy
        run: |
          echo "Deploy step - configure your hosting here"
          echo "Build artifact ready in dist/"
          # Example: npx vercel --prod --token=${{ secrets.VERCEL_TOKEN }}
          # Example: rsync -avz dist/ user@host:/path/
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  ci:
    name: CI Check
    runs-on: ubuntu-latest
    steps:
      - run: echo "Checking CI passed..."