services:
  - type: web
    name: kothay-gelo-api
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        value: https://kothay-gelo-api.onrender.com
      - key: PORT
        value: "10000"
      - key: DEMO_SEED
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_APP_DB_URL
        sync: false
      - key: SUPABASE_APP_DB_PASSWORD
        sync: false