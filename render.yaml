services:
  - type: web
    name: kothay-gelo-api
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kothay-gelo-db
          property: connectionString
      - key: APP_URL
        value: https://kothay-gelo-api.onrender.com
      - key: PORT
        value: "10000"
      - key: DEMO_SEED
        value: "1"
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: kothay-gelo-db
    databaseName: kothay_gelo
    user: kothay_gelo
    plan: free